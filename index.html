    // ── Firebase ──────────────────────────────────────────
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd4A_pADDrgyoLJnFkeiGtDTrDTV7B2BU",
      authDomain: "strand-financial.firebaseapp.com",
      projectId: "strand-financial",
      storageBucket: "strand-financial.firebasestorage.app",
      messagingSenderId: "467096853715",
      appId: "1:467096853715:web:4122e315b741214edac826"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const BALANCES_DOC = doc(db, 'dashboard', 'balances');

    window._fbSaveBalances = async function(balances) {
      await setDoc(BALANCES_DOC, { balances, updatedAt: new Date().toISOString() });
    };

    window._fbLoadBalances = async function() {
      const snap = await getDoc(BALANCES_DOC);
      return snap.exists() ? snap.data().balances : null;
    };

    // Init: load from Firestore, then render
    (async () => {
      try {
        const balances = await window._fbLoadBalances();
        if (balances) {
          balances.forEach((b, i) => {
            if (window.DATA && window.DATA.accounts[i] !== undefined)
              window.DATA.accounts[i].balance = b;
          });
          localStorage.setItem('sb_financial_balances', JSON.stringify(balances));
        } else {
          // First load — push hardcoded values up to Firestore
          const initial = window.DATA.accounts.map(a => a.balance);
          await window._fbSaveBalances(initial);
        }
      } catch(e) {
        console.warn('Firestore load failed, using local data:', e);
      }
      window.renderAll();
    })();
  </script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e8eaf6;
      --muted: #8891b0;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Header */
    header { background: linear-gradient(135deg,#1a1d27 0%,#16192a 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }
    header h1 span { color: var(--accent); }
    .header-meta { font-size: .8rem; color: var(--muted); }
    .edit-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .85rem; transition: background .2s; }
    .edit-btn:hover { background: var(--border); }

    /* Nav */
    nav { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    nav button { background: none; border: none; color: var(--muted); padding: 10px 20px; cursor: pointer; font-size: .9rem; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .2s, border-color .2s; }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
    nav button:hover:not(.active) { color: var(--text); }

    /* Pages */
    .page { display: none; padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
    .page.active { display: block; }

    /* KPI cards */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; cursor: pointer; }
    .kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-color, var(--accent)); }
    .kpi-label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
    .kpi-value { font-size: 1.65rem; font-weight: 700; line-height: 1; }
    .kpi-sub { font-size: .8rem; color: var(--muted); margin-top: 6px; }

    /* Cards */
    .chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
    .card h3 { font-size: .9rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 18px; }
    .chart-wrap { position: relative; height: 220px; }
    .chart-wrap-lg { position: relative; height: 280px; }

    /* Tables */
    .account-table { width: 100%; border-collapse: collapse; }
    .account-table th { text-align: left; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .account-table td { padding: 11px 12px; font-size: .9rem; border-bottom: 1px solid rgba(46,51,80,.5); }
    .account-table tr:last-child td { border-bottom: none; }
    .amount-pos { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
    .amount-neg { color: var(--red); font-weight: 600; font-variant-numeric: tabular-nums; }
    .amount { font-variant-numeric: tabular-nums; }

    /* Badges */
    .badge { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .badge-blue   { background: rgba(79,142,247,.15);  color: var(--accent); }
    .badge-purple { background: rgba(124,92,252,.15);  color: #a78bfa; }
    .badge-green  { background: rgba(52,211,153,.15);  color: var(--green); }
    .badge-yellow { background: rgba(251,191,36,.15);  color: var(--yellow); }
    .badge-red    { background: rgba(248,113,113,.15); color: var(--red); }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* Progress bar */
    .progress-bar-bg { background: var(--surface2); border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .progress-label { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-top: 5px; }

    /* ── Investment drill-down ── */
    .inv-account-row { cursor: pointer; transition: background .15s; }
    .inv-account-row:hover td { background: var(--surface2); }
    .inv-account-row td:first-child { padding-left: 12px; }
    .inv-expand-icon { display: inline-block; width: 16px; text-align: center; margin-right: 6px; transition: transform .2s; color: var(--muted); font-size: .8rem; }
    .inv-account-row.open .inv-expand-icon { transform: rotate(90deg); color: var(--accent); }
    .holdings-row { display: none; }
    .holdings-row.open { display: table-row; }
    .holdings-panel { padding: 0 12px 16px 28px; }
    .holdings-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .82rem; }
    .holdings-table th { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    .holdings-table th:first-child, .holdings-table th:nth-child(2) { text-align: left; }
    .holdings-table td { padding: 7px 10px; border-bottom: 1px solid rgba(46,51,80,.3); text-align: right; }
    .holdings-table td:first-child, .holdings-table td:nth-child(2) { text-align: left; }
    .holdings-table tr:last-child td { border-bottom: none; }
    .holdings-table tr:hover td { background: rgba(79,142,247,.05); }
    .symbol-chip { font-weight: 700; font-size: .78rem; color: var(--accent); font-family: 'Courier New', monospace; }
    .no-holdings { font-size: .82rem; color: var(--muted); padding: 12px 0; font-style: italic; }

    /* Holdings chart in panel */
    .holdings-chart-wrap { height: 180px; margin-bottom: 12px; }

    /* Edit modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; width: 90%; max-width: 720px; max-height: 85vh; overflow-y: auto; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .modal p { font-size: .82rem; color: var(--muted); margin-bottom: 20px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: .78rem; color: var(--muted); }
    .field input { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 8px 12px; font-size: .9rem; }
    .field input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 9px 22px; border-radius: 8px; cursor: pointer; font-size: .9rem; font-weight: 600; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 9px 22px; border-radius: 8px; cursor: pointer; font-size: .9rem; }

    @media (max-width: 640px) {

      .page { padding: 16px; }
      nav { padding: 12px 16px 0; }
      .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
// ── Helpers ──────────────────────────────────────────────
const fmt  = n => '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => { const a=Math.abs(n); return a>=1000 ? '$'+(a/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'K' : fmt(n); };
const fmtPct = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';

const PALETTE = [
  '#4f8ef7','#7c5cfc','#34d399','#fbbf24','#f87171',
  '#60a5fa','#a78bfa','#6ee7b7','#fcd34d','#fca5a5',
  '#93c5fd','#c4b5fd','#86efac','#fde68a','#fecaca',
  '#38bdf8','#818cf8','#4ade80','#facc15','#fb923c',
];

// ── Computed ──────────────────────────────────────────────
function compute() {
  const checking       = DATA.accounts.filter(a => a.type==='Checking');
  const savings        = DATA.accounts.filter(a => a.type==='Savings');
  const retirement     = DATA.accounts.filter(a => a.type==='Retirement');
  const invSavings     = DATA.accounts.filter(a => a.type==='Invested Savings');
  const mortgages      = DATA.accounts.filter(a => a.type==='Liability');
  const realEstate     = DATA.accounts.filter(a => a.type==='Real Estate');
  const other          = DATA.accounts.filter(a => a.type==='Other Asset' || a.type==='HSA');
  const sum = arr => arr.reduce((s,a)=>s+a.balance,0);
  const totalChecking    = sum(checking);
  const totalSavings     = sum(savings);
  const totalRetirement  = sum(retirement);
  const totalInvSavings  = sum(invSavings);
  const totalInvestments = totalRetirement + totalInvSavings;
  const totalMortgage    = sum(mortgages);
  const totalRealEstate  = sum(realEstate);
  const totalOther       = sum(other);
  const totalAssets = totalChecking+totalSavings+totalRetirement+totalInvSavings+totalRealEstate+totalOther;
  const netWorth = totalAssets+totalMortgage;
  return {checking,savings,retirement,invSavings,mortgages,realEstate,other,
    totalChecking,totalSavings,totalRetirement,totalInvSavings,totalInvestments,
    totalMortgage,totalRealEstate,totalOther,totalAssets,totalLiab:totalMortgage,netWorth};
}

const charts = {};
function destroyChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }

// ── KPI Row ───────────────────────────────────────────────
function renderKPIs(c) {
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi" style="--accent-color:#4f8ef7" onclick="showPage('accounts',document.querySelector('nav button:nth-child(2)'))">
      <div class="kpi-label">Net Worth</div><div class="kpi-value">${fmtK(c.netWorth)}</div>
      <div class="kpi-sub">${fmt(c.netWorth)}</div>
    </div>
    <div class="kpi" style="--accent-color:#34d399" onclick="showPage('accounts',document.querySelector('nav button:nth-child(2)'))">
      <div class="kpi-label">Total Assets</div><div class="kpi-value">${fmtK(c.totalAssets)}</div>
      <div class="kpi-sub">Across all accounts</div>
    </div>
    <div class="kpi" style="--accent-color:#f87171" onclick="showPage('accounts',document.querySelector('nav button:nth-child(2)'))">
      <div class="kpi-label">Total Liabilities</div><div class="kpi-value">${fmtK(Math.abs(c.totalLiab))}</div>
      <div class="kpi-sub">Mortgage + Solar Panels</div>
    </div>
    <div class="kpi" style="--accent-color:#7c5cfc" onclick="showPage('investments',document.querySelector('nav button:nth-child(3)'))">
      <div class="kpi-label">Retirement</div><div class="kpi-value">${fmtK(c.totalRetirement)}</div>
      <div class="kpi-sub">401k, IRA, Brokerage</div>
    </div>
    <div class="kpi" style="--accent-color:#34d399" onclick="showPage('investments',document.querySelector('nav button:nth-child(3)'))">
      <div class="kpi-label">Invested Savings</div><div class="kpi-value">${fmtK(c.totalInvSavings)}</div>
      <div class="kpi-sub">Acorns, Fidelity, Betterment</div>
    </div>
    <div class="kpi" style="--accent-color:#fbbf24" onclick="showPage('accounts',document.querySelector('nav button:nth-child(2)'))">
      <div class="kpi-label">Cash & Savings</div><div class="kpi-value">${fmtK(c.totalChecking+c.totalSavings)}</div>
      <div class="kpi-sub">Checking + Savings</div>
    </div>`;
}

// ── Summary charts ────────────────────────────────────────
function renderAssetsLiabChart(c) {
  destroyChart('assetsLiab');
  const ctx = document.getElementById('chartAssetsLiab').getContext('2d');
  charts['assetsLiab'] = new Chart(ctx, {
    type: 'bar',
    data: { labels: ['Checking','Savings','Retirement','Inv. Savings','Real Estate','Other','Mortgage'],
      datasets: [{ data: [c.totalChecking,c.totalSavings,c.totalRetirement,c.totalInvSavings,c.totalRealEstate,c.totalOther,c.totalMortgage],        backgroundColor: ['rgba(79,142,247,.8)','rgba(251,191,36,.8)','rgba(124,92,252,.8)','rgba(52,211,153,.8)','rgba(96,165,250,.8)','rgba(56,189,248,.8)','rgba(248,113,113,.8)'],
        borderRadius: 6 }] },
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#8891b0',font:{size:11}}},
        y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#8891b0',font:{size:11},callback:v=>'$'+(Math.abs(v)/1000).toFixed(0)+'K'}} } }
  });
}

function renderAllocationChart(c) {
  destroyChart('allocation');
  const ctx = document.getElementById('chartAllocation').getContext('2d');
  charts['allocation'] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels:['Checking','Savings','Retirement','Invested Savings','Real Estate','HSA/Other'],
      datasets:[{data:[c.totalChecking,c.totalSavings,c.totalRetirement,c.totalInvSavings,c.totalRealEstate,c.totalOther],
        backgroundColor:PALETTE.slice(0,6),borderWidth:0,hoverOffset:6}] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{position:'right',labels:{color:'#8891b0',font:{size:11},boxWidth:12,padding:10}},
        tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmt(ctx.raw)}`}} } }
  });
}

function renderNWProgress(c) {
  document.getElementById('nwProgressSection').innerHTML = `
    <div style="margin-bottom:4px">
      <span style="font-size:2rem;font-weight:700">${fmt(c.netWorth)}</span>
    </div>
    <hr class="divider" style="margin:14px 0">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Retirement</div>
        <div style="font-size:1.1rem;font-weight:700">${fmt(c.totalRetirement)}</div></div>
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Invested Savings</div>
        <div style="font-size:1.1rem;font-weight:700">${fmt(c.totalInvSavings)}</div></div>
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Cash & Savings</div>
        <div style="font-size:1.1rem;font-weight:700">${fmt(c.totalChecking+c.totalSavings)}</div></div>
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Real Estate</div>
        <div style="font-size:1.1rem;font-weight:700">${fmt(c.totalRealEstate)}</div></div>
    </div>
    <hr class="divider" style="margin:14px 0">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Home Equity</div>
        <div style="font-size:1.1rem;font-weight:700">${fmt(c.totalRealEstate+c.totalLiab)}</div></div>
      <div><div style="font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px">Debt-to-Asset</div>
        <div style="font-size:1.1rem;font-weight:700">${(Math.abs(c.totalLiab)/c.totalAssets*100).toFixed(1)}%</div></div>
    </div>`;
}

// ── Accounts table ────────────────────────────────────────
function renderAccountsTable(c) {
  const groups = [
    {label:'Checking',            accounts:c.checking,                         badge:'badge-yellow'},
    {label:'Savings',             accounts:c.savings,                          badge:'badge-green'},
    {label:'Retirement',          accounts:c.retirement,                       badge:'badge-purple'},
    {label:'Invested Savings',    accounts:c.invSavings,                       badge:'badge-blue'},
    {label:'Real Estate & Other', accounts:[...c.realEstate,...c.other],       badge:'badge-blue'},
    {label:'Liabilities',         accounts:c.mortgages,                        badge:'badge-red'},
  ];
  let html = '<thead><tr><th>Account</th><th>Type</th><th style="text-align:right">Balance</th></tr></thead><tbody>';
  for (const g of groups) {
    if (!g.accounts.length) continue;
    const total = g.accounts.reduce((s,a)=>s+a.balance,0);
    html += `<tr><td colspan="3" style="padding:14px 12px 4px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600">
      ${g.label} <span style="color:var(--text);margin-left:8px">${fmt(total)}</span></td></tr>`;
    for (const a of g.accounts) {
      const cls = a.balance < 0 ? 'amount-neg' : 'amount';
      html += `<tr><td>${a.name}</td>
        <td><span class="badge ${g.badge}">${a.type}</span></td>
        <td style="text-align:right" class="${cls}">${a.balance<0?'-':''}${fmt(a.balance)}</td></tr>`;
    }
  }
  html += '</tbody>';
  document.getElementById('allAccountsTable').innerHTML = html;
}

// ── Investments page ──────────────────────────────────────
function renderInvestments(c) {
  document.getElementById('invKpiRow').innerHTML = `
    <div class="kpi" style="--accent-color:#7c5cfc">
      <div class="kpi-label">Total Invested</div><div class="kpi-value">${fmtK(c.totalInvestments)}</div>
      <div class="kpi-sub">Retirement + Invested Savings</div>
    </div>
    <div class="kpi" style="--accent-color:#4f8ef7">
      <div class="kpi-label">Retirement</div><div class="kpi-value">${fmtK(c.totalRetirement)}</div>
      <div class="kpi-sub">Ameriprise, 401k, Roth IRA</div>
    </div>
    <div class="kpi" style="--accent-color:#34d399">
      <div class="kpi-label">Invested Savings</div><div class="kpi-value">${fmtK(c.totalInvSavings)}</div>
      <div class="kpi-sub">Acorns, Fidelity, Betterment</div>
    </div>
  `;

  // Account table with drill-down — two sections
  let html = `<thead><tr>
    <th>Account</th>
    <th>Type</th>
    <th style="text-align:right">Balance</th>
    <th style="text-align:right">% of Total</th>
  </tr></thead><tbody>`;

  const renderGroup = (label, accounts, badge) => {
    const groupTotal = accounts.reduce((s,a)=>s+a.balance,0);
    html += `<tr><td colspan="4" style="padding:14px 12px 4px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600">
      ${label} <span style="color:var(--text);margin-left:8px">${fmt(groupTotal)}</span></td></tr>`;
    accounts.forEach((a, i) => {
      const idx = DATA.accounts.indexOf(a);
      const pct = (a.balance / c.totalInvestments * 100).toFixed(1);
      const hasHoldings = a.holdingsKey && DATA.holdings[a.holdingsKey];
      const chevron = hasHoldings
        ? `<span class="inv-expand-icon">▶</span>`
        : `<span class="inv-expand-icon" style="opacity:0">▶</span>`;
      html += `<tr class="inv-account-row${hasHoldings?' has-holdings':''}" data-idx="${idx}" onclick="${hasHoldings?`toggleHoldings(this,${idx})`:''}">
        <td>${chevron}${a.name}</td>
        <td><span class="badge ${badge}">${a.subtype||label}</span></td>
        <td style="text-align:right" class="amount">${fmt(a.balance)}</td>
        <td style="text-align:right;color:var(--muted)">${pct}%</td>
      </tr>`;
      if (hasHoldings) {
        html += `<tr class="holdings-row" id="holdings-${idx}">
          <td colspan="4" style="padding:0;background:var(--surface2)">
            <div class="holdings-panel">${buildHoldingsPanel(a.holdingsKey, a.balance)}</div>
          </td>
        </tr>`;
      }
    });
  };

  renderGroup('Retirement', c.retirement, 'badge-purple');
  renderGroup('Invested Savings', c.invSavings, 'badge-green');

  html += '</tbody>';
  document.getElementById('invTable').innerHTML = html;
}

function toggleHoldings(row, idx) {
  const panel = document.getElementById('holdings-'+idx);
  const isOpen = row.classList.contains('open');
  row.classList.toggle('open', !isOpen);
  panel.classList.toggle('open', !isOpen);
}

function buildHoldingsPanel(key, accountBalance) {
  const holdings = DATA.holdings[key];
  if (!holdings || !holdings.length) return '<p class="no-holdings">No holdings data available.</p>';

  const sorted = [...holdings].sort((a,b)=>b.value-a.value);

  let rows = '';
  for (const h of sorted) {
    const pctOfAcct = (h.value / accountBalance * 100).toFixed(1);
    rows += `<tr>
      <td><span class="symbol-chip">${h.symbol}</span></td>
      <td style="color:var(--muted);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.description}</td>
      <td style="text-align:right">${h.qty.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3})}</td>
      <td style="text-align:right;color:var(--muted)">${pctOfAcct}%</td>
    </tr>`;
  }

  return `
    <div style="overflow-x:auto">
      <table class="holdings-table">
        <thead><tr>
          <th>Symbol</th><th>Name</th>
          <th style="text-align:right">Qty</th>
          <th style="text-align:right">% Acct</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── localStorage persistence ──────────────────────────────
const STORAGE_KEY = 'sb_financial_balances';

function saveToStorage() {
  const balances = DATA.accounts.map(a => a.balance);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(balances));
}

function loadFromStorage() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  try {
    const balances = JSON.parse(saved);
    balances.forEach((b, i) => {
      if (DATA.accounts[i] !== undefined) DATA.accounts[i].balance = b;
    });
  } catch(e) { /* ignore corrupted data */ }
}

function resetToDefaults() {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ── Edit modal ────────────────────────────────────────────
function openEdit() {
  let html = '';
  DATA.accounts.forEach((a,i) => {
    html += `<div class="field"><label>${a.name}</label>
      <input type="number" step="0.01" data-idx="${i}" value="${a.balance}"/></div>`;
  });
  document.getElementById('editFields').innerHTML = html;
  document.getElementById('editModal').classList.add('open');
}
function closeEdit() { document.getElementById('editModal').classList.remove('open'); }
function saveEdit() {
  document.querySelectorAll('#editFields input[data-idx]').forEach(inp => {
    DATA.accounts[+inp.dataset.idx].balance = parseFloat(inp.value)||0;
  });
  const balances = DATA.accounts.map(a => a.balance);
  saveToStorage();
  closeEdit();
  renderAll();

  // Push to Firestore — all devices see the update
  const btn = document.querySelector('#editModal .btn-primary');
  if (window._fbSaveBalances) {
    if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }
    window._fbSaveBalances(balances)
      .then(() => { if (btn) { btn.textContent = 'Save Changes'; btn.disabled = false; } })
      .catch(e => {
        console.error('Firestore save failed:', e);
        if (btn) { btn.textContent = 'Save Changes'; btn.disabled = false; }
        alert('Saved locally, but cloud sync failed. Check your connection.');
      });
  }
}

// ── Income page ───────────────────────────────────────────
function renderIncome() {
  const sp = DATA.income.spencer;
  const br = DATA.income.bridget;
  const combinedPay = sp.totalPay + br.totalPay;
  const allDist = [...sp.distributions, ...br.distributions];
  const totalDist = allDist.reduce((s,d) => s+d.amount, 0);

  // Category totals
  const byCategory = {};
  for (const d of allDist) {
    byCategory[d.category] = (byCategory[d.category] || 0) + d.amount;
  }

  // KPI row
  document.getElementById('incomeKpiRow').innerHTML = `
    <div class="kpi" style="--accent-color:#34d399">
      <div class="kpi-label">Monthly Income</div>
      <div class="kpi-value">${fmtK(combinedPay)}</div>
      <div class="kpi-sub">${fmt(combinedPay)} net</div>
    </div>
    <div class="kpi" style="--accent-color:#7c5cfc">
      <div class="kpi-label">To Retirement</div>
      <div class="kpi-value">${fmtK(byCategory['Retirement']||0)}</div>
      <div class="kpi-sub">${combinedPay>0?((byCategory['Retirement']||0)/combinedPay*100).toFixed(1):'0'}% of income</div>
    </div>
    <div class="kpi" style="--accent-color:#4f8ef7">
      <div class="kpi-label">To Invested Savings</div>
      <div class="kpi-value">${fmtK(byCategory['Invested Savings']||0)}</div>
      <div class="kpi-sub">${combinedPay>0?((byCategory['Invested Savings']||0)/combinedPay*100).toFixed(1):'0'}% of income</div>
    </div>
    <div class="kpi" style="--accent-color:#fbbf24">
      <div class="kpi-label">Take-Home</div>
      <div class="kpi-value">${fmtK(byCategory['Checking']||0)}</div>
      <div class="kpi-sub">${combinedPay>0?((byCategory['Checking']||0)/combinedPay*100).toFixed(1):'0'}% of income</div>
    </div>
  `;

  const catBadge = {
    'Retirement':      'badge-purple',
    'Invested Savings':'badge-green',
    'Savings':         'badge-yellow',
    'Checking':        'badge-blue',
  };

  const renderPersonTable = (person) => {
    if (!person.totalPay && !person.distributions.length) return '';
    const personTotal = person.distributions.reduce((s,d)=>s+d.amount,0);
    const pctSaved = person.totalPay > 0
      ? ((person.distributions.filter(d=>d.category!=='Checking').reduce((s,d)=>s+d.amount,0)) / person.totalPay * 100).toFixed(1)
      : '—';

    let rows = '';
    for (const d of person.distributions) {
      const pct = person.totalPay > 0 ? (d.amount/person.totalPay*100).toFixed(1) : '—';
      rows += `<tr>
        <td>${d.label}</td>
        <td style="color:var(--muted);font-size:.85rem">${d.account}</td>
        <td><span class="badge ${catBadge[d.category]||'badge-blue'}">${d.category}</span></td>
        <td style="text-align:right" class="amount">${fmt(d.amount)}</td>
        <td style="text-align:right;color:var(--muted)">${pct}%</td>
      </tr>`;
    }

    return `
      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px">
          <h3>${person.label}</h3>
          <div style="display:flex;gap:20px">
            <div style="text-align:right">
              <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Net Monthly</div>
              <div style="font-weight:700">${fmt(person.totalPay)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Savings Rate</div>
              <div style="font-weight:700">${pctSaved}%</div>
            </div>
          </div>
        </div>
        <table class="account-table">
          <thead><tr>
            <th>Distribution</th><th>Account</th><th>Category</th>
            <th style="text-align:right">Monthly</th>
            <th style="text-align:right">% of Pay</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  };

  // Stacked bar chart data
  const chartLabels = Object.keys(byCategory);
  const chartValues = chartLabels.map(k => byCategory[k]);

  document.getElementById('incomeContent').innerHTML = `
    <div class="chart-row" style="grid-template-columns:minmax(260px,340px) 1fr;margin-bottom:20px">
      <div class="card">
        <h3>Distribution Breakdown</h3>
        <div class="chart-wrap"><canvas id="chartIncomeDist"></canvas></div>
      </div>
      <div class="card">
        <h3>Monthly Flow</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0">
          ${Object.entries(byCategory).map(([cat,val]) => `
            <div>
              <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px">${cat}</div>
              <div style="font-weight:700;font-size:1.05rem">${fmt(val)}</div>
              <div style="font-size:.75rem;color:var(--muted)">${combinedPay>0?(val/combinedPay*100).toFixed(1):'0'}% of income</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    ${renderPersonTable(sp)}
    ${br.totalPay > 0 || br.distributions.length > 0 ? renderPersonTable(br) : `
      <div class="card" style="border-style:dashed;text-align:center;padding:32px;color:var(--muted)">
        <div style="font-size:1rem;margin-bottom:6px">Bridget's income coming soon</div>
        <div style="font-size:.82rem">Add Bridget's data to the <code>DATA.income.bridget</code> section</div>
      </div>`}
  `;

  // Doughnut chart
  destroyChart('incomeDist');
  const ctx = document.getElementById('chartIncomeDist').getContext('2d');
  charts['incomeDist'] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: chartLabels,
      datasets:[{ data: chartValues, backgroundColor: PALETTE.slice(0,chartLabels.length), borderWidth:0, hoverOffset:6 }]
    },
    options: { responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{position:'right',labels:{color:'#8891b0',font:{size:11},boxWidth:12,padding:10}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.raw)}`}} } }
  });
}

// ── Navigation ────────────────────────────────────────────
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if (btn) btn.classList.add('active');
  const c = compute();
  if (id==='investments') renderInvestments(c);
  if (id==='income')      renderIncome();
}

// ── Full render ───────────────────────────────────────────
function renderAll() {
  const c = compute();
  renderKPIs(c);
  renderAssetsLiabChart(c);
  renderAllocationChart(c);
  renderNWProgress(c);
  renderAccountsTable(c);
}

// Expose globals for Firebase module script
window.DATA = DATA;
window.renderAll = renderAll;
</script>
